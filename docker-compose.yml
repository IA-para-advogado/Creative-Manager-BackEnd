services:
  # Development container (runs dev server inside container)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    container_name: creative-manager-frontend-dev
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BACKEND=${VITE_API_BACKEND:-http://localhost:3000/api}
    restart: unless-stopped
